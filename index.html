<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS(TEST)</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      min-height: 100vh;
      font-family: sans-serif;
      transition: all 0.3s ease;
      overflow-x: hidden;
      box-sizing: border-box;
    }
    .title {
      display: inline-block;
      transition: transform 0.3s;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
    }
    .card {
      padding: 20px;
      background: #ffffff;
      border: 3px solid #000000;
      box-shadow: 5px 5px 0 #000000;
      font-weight: bold;
      transition: transform 0.3s;
    }
    .random-btn {
      display: inline-block;
      margin-top: 50px;
      padding: 15px 30px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1 class="title" id="main-title">CHANGE DESIGN</h1>
  <p id="sub-text">F5 to change the design</p>

  <div class="container">
    <div class="card">作品要素 A</div>
    <div class="card">作品要素 B</div>
    <div class="card">作品要素 C</div>
  </div>

  <div>
    <a href="#" class="random-btn" id="art-link">ランダムなリンク先へ</a>
  </div>

  <script>
    // ページ読み込み（アクセス）時に発動するスクリプト
    document.addEventListener('DOMContentLoaded', () => {
      
      // 1. 背景色をランダムに変える
      const colors = ['#f4f4f0', '#ffe6e6', '#e6f0ff', '#e6ffe6', '#fff0e6', '#222222'];
      const randomBg = colors[Math.floor(Math.random() * colors.length)];
      document.body.style.backgroundColor = randomBg;
      
      // 背景が黒っぽい場合は文字を白くする
      if (randomBg === '#222222') {
        document.body.style.color = '#ffffff';
      }

      // 2. タイトルの大きさと傾きをランダムに変える
      const title = document.getElementById('main-title');
      const rotate = Math.floor(Math.random() * 30) - 15; // -15deg〜15deg
      const size = Math.floor(Math.random() * 20) + 24; // 24px〜44px
      title.style.transform = `rotate(${rotate}deg)`;
      title.style.fontSize = `${size}px`;

      // 3. カード要素を個別に傾けたりズラしたりする
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const r = Math.floor(Math.random() * 60) - 30; // -30deg〜30deg
        const x = Math.floor(Math.random() * 40) - 20; // -20px〜20px
        const y = Math.floor(Math.random() * 40) - 20;
        card.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
      });

      // 4. ボタンのリンク先をアクセス毎にランダムに変更する
      const links = [
        'https://www.google.com',
        'https://kds.ac.jp',
        'https://ryukitanaka.com',
        'https://youtube.com'
      ];
      const linkBtn = document.getElementById('art-link');
      linkBtn.href = links[Math.floor(Math.random() * links.length)];
      linkBtn.target = "_blank"; // 別タブで開く
    });
  </script>
</body>
</html>
